<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="nd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="cc" x="-8%" y="-30%" width="116%" height="170%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="gg" markerWidth="8" markerHeight="8" refX="6.5" refY="2.6" orient="auto"><path d="M0,0 L6.5,2.6 L0,5.2 Z" fill="#16a34a"/></marker>
    <marker id="rr" markerWidth="8" markerHeight="8" refX="6.5" refY="2.6" orient="auto"><path d="M0,0 L6.5,2.6 L0,5.2 Z" fill="#dc2626"/></marker>
  </defs>
  <rect width="920" height="620" fill="#ffffff"/>
  <text x="460" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">BGP 对等体是怎么「起来」的：四段式</text>
  <text x="460" y="61" text-anchor="middle" font-size="12.5" fill="#64748b">先定位「卡在哪一段」，而不是一上来就 debug</text>

  <!-- spine -->
  <line x1="90" y1="160" x2="90" y2="212" stroke="#16a34a" stroke-width="2.5"/>
  <line x1="90" y1="314" x2="90" y2="366" stroke="#16a34a" stroke-width="2.5"/>
  <line x1="90" y1="468" x2="90" y2="520" stroke="#16a34a" stroke-width="2.5" marker-end="url(#gg)"/>
  <text x="104" y="190" font-size="12" font-weight="700" fill="#16a34a">✓</text>
  <text x="104" y="344" font-size="12" font-weight="700" fill="#16a34a">✓</text>
  <text x="104" y="498" font-size="12" font-weight="700" fill="#16a34a">✓</text>

  <!-- Seg 1: TCP 179 -->
  <circle cx="90" cy="130" r="19" fill="url(#nd)"/>
  <text x="90" y="136" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">1</text>
  <line x1="109" y1="130" x2="130" y2="130" stroke="#cbd5e1" stroke-width="1.4"/>
  <g filter="url(#cc)"><rect x="130" y="98" width="345" height="64" rx="10" fill="#fff" stroke="#e5e7eb" stroke-width="1.3"/></g>
  <text x="150" y="122" font-size="14.5" font-weight="600" fill="#111827">TCP 179 连接能建立？</text>
  <text x="150" y="144" font-size="11" font-family="Consolas, monospace" fill="#6b7280">状态 Idle→Active / show tcp brief</text>
  <line x1="477" y1="130" x2="516" y2="130" stroke="#dc2626" stroke-width="1.4" marker-end="url(#rr)"/>
  <text x="496" y="123" text-anchor="middle" font-size="10.5" font-weight="700" fill="#dc2626">✗</text>
  <rect x="520" y="100" width="368" height="60" rx="9" fill="#fef2f2" stroke="#fecaca" stroke-width="1.1"/>
  <text x="536" y="122" font-size="11" font-weight="700" fill="#b91c1c">第一段 · TCP 连不上（3.3）</text>
  <text x="536" y="140" font-size="11.5" fill="#7f1d1d">对端未监听 / ACL 拦 179 / update-source</text>
  <text x="536" y="155" font-size="11.5" fill="#7f1d1d">多跳 TTL / 路径 MTU 反复断</text>

  <!-- Seg 2: OPEN -->
  <circle cx="90" cy="284" r="19" fill="url(#nd)"/>
  <text x="90" y="290" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">2</text>
  <line x1="109" y1="284" x2="130" y2="284" stroke="#cbd5e1" stroke-width="1.4"/>
  <g filter="url(#cc)"><rect x="130" y="252" width="345" height="64" rx="10" fill="#fff" stroke="#e5e7eb" stroke-width="1.3"/></g>
  <text x="150" y="276" font-size="14.5" font-weight="600" fill="#111827">OPEN 协商被接受？</text>
  <text x="150" y="298" font-size="11" font-family="Consolas, monospace" fill="#6b7280">OpenSent→OpenConfirm / 错误码 2/x</text>
  <line x1="477" y1="284" x2="516" y2="284" stroke="#dc2626" stroke-width="1.4" marker-end="url(#rr)"/>
  <text x="496" y="277" text-anchor="middle" font-size="10.5" font-weight="700" fill="#dc2626">✗</text>
  <rect x="520" y="254" width="368" height="60" rx="9" fill="#fef2f2" stroke="#fecaca" stroke-width="1.1"/>
  <text x="536" y="276" font-size="11" font-weight="700" fill="#b91c1c">第二段 · OPEN 被拒（3.4）</text>
  <text x="536" y="294" font-size="11.5" fill="#7f1d1d">AS 不匹配(2/2) / router-id 冲突(2/3)</text>
  <text x="536" y="309" font-size="11.5" fill="#7f1d1d">hold time(2/6) / MD5 / AFI-SAFI</text>

  <!-- Seg 3: Keepalive / Established -->
  <circle cx="90" cy="438" r="19" fill="url(#nd)"/>
  <text x="90" y="444" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">3</text>
  <line x1="109" y1="438" x2="130" y2="438" stroke="#cbd5e1" stroke-width="1.4"/>
  <g filter="url(#cc)"><rect x="130" y="406" width="345" height="64" rx="10" fill="#fff" stroke="#e5e7eb" stroke-width="1.3"/></g>
  <text x="150" y="430" font-size="14.5" font-weight="600" fill="#111827">会话稳定 Established？</text>
  <text x="150" y="452" font-size="11" font-family="Consolas, monospace" fill="#6b7280">KEEPALIVE 维持 / 查抖动次数</text>
  <line x1="477" y1="438" x2="516" y2="438" stroke="#dc2626" stroke-width="1.4" marker-end="url(#rr)"/>
  <text x="496" y="431" text-anchor="middle" font-size="10.5" font-weight="700" fill="#dc2626">✗</text>
  <rect x="520" y="408" width="368" height="60" rx="9" fill="#fef2f2" stroke="#fecaca" stroke-width="1.1"/>
  <text x="536" y="430" font-size="11" font-weight="700" fill="#b91c1c">第三段 · 抖动 / 资源（3.5）</text>
  <text x="536" y="448" font-size="11.5" fill="#7f1d1d">hold expired / max-prefix 自踢</text>
  <text x="536" y="463" font-size="11.5" fill="#7f1d1d">BFD 放大 / 邻居数耗尽</text>

  <!-- Seg 4: UPDATE / PfxRcd -->
  <circle cx="90" cy="548" r="19" fill="url(#nd)"/>
  <text x="90" y="554" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">4</text>
  <line x1="109" y1="548" x2="130" y2="548" stroke="#cbd5e1" stroke-width="1.4"/>
  <g filter="url(#cc)"><rect x="130" y="516" width="345" height="64" rx="10" fill="#fff" stroke="#e5e7eb" stroke-width="1.3"/></g>
  <text x="150" y="540" font-size="14.5" font-weight="600" fill="#111827">UPDATE 收到前缀？</text>
  <text x="150" y="562" font-size="11" font-family="Consolas, monospace" fill="#6b7280">PfxRcd 计数 &gt; 0 = 真通</text>
  <line x1="477" y1="548" x2="516" y2="548" stroke="#dc2626" stroke-width="1.4" marker-end="url(#rr)"/>
  <text x="496" y="541" text-anchor="middle" font-size="10.5" font-weight="700" fill="#dc2626">✗</text>
  <rect x="520" y="518" width="368" height="60" rx="9" fill="#fef2f2" stroke="#fecaca" stroke-width="1.1"/>
  <text x="536" y="540" font-size="11" font-weight="700" fill="#b91c1c">第四段 · Established 但 PfxRcd=0</text>
  <text x="536" y="558" font-size="11.5" fill="#7f1d1d">AFI/SAFI 未激活 / 出向过滤</text>
  <text x="536" y="573" font-size="11.5" fill="#7f1d1d">→ 转入第 4 章策略排错</text>

  <line x1="520" y1="600" x2="552" y2="600" stroke="#16a34a" stroke-width="2.5" marker-end="url(#gg)"/>
  <text x="564" y="604" font-size="11.5" fill="#64748b">段内通过，进入下一段</text>
  <line x1="700" y1="600" x2="732" y2="600" stroke="#dc2626" stroke-width="1.6" marker-end="url(#rr)"/>
  <text x="744" y="604" font-size="11.5" fill="#64748b">卡在该段，按根因清单查</text>
</svg>