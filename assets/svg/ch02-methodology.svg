<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <filter id="mc" x="-8%" y="-10%" width="116%" height="128%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="ma" markerWidth="8" markerHeight="8" refX="6.5" refY="2.6" orient="auto"><path d="M0,0 L6.5,2.6 L0,5.2 Z" fill="#0969da"/></marker>
  </defs>
  <rect width="960" height="540" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">六大通用排错方法</text>
  <text x="480" y="56" text-anchor="middle" font-size="12.5" fill="#64748b">没有万能方法——先判断故障类型，再选最省力的切入角度</text>

  <!-- grid: 3 cols x 2 rows. cell w=290 h=200, gap. x:30,335,640 ; y:75,300 -->
  <!-- helper icon area top (h≈86), text bottom -->

  <!-- 1 自底向上 -->
  <g filter="url(#mc)"><rect x="30" y="75" width="290" height="200" rx="14" fill="#fff" stroke="#e5e7eb" stroke-width="1.3"/></g>
  <g>
    <line x1="175" y1="150" x2="175" y2="92" stroke="#0969da" stroke-width="2.2" marker-end="url(#ma)"/>
    <rect x="115" y="150" width="120" height="16" rx="4" fill="#dbeafe"/>
    <rect x="115" y="128" width="120" height="16" rx="4" fill="#bfdbfe"/>
    <rect x="115" y="106" width="120" height="16" rx="4" fill="#93c5fd"/>
    <text x="175" y="163" font-size="9.5" text-anchor="middle" fill="#1e3a8a">物理/链路</text>
    <text x="175" y="141" font-size="9.5" text-anchor="middle" fill="#1e3a8a">路由/BGP</text>
    <text x="175" y="119" font-size="9.5" text-anchor="middle" fill="#1e3a8a">应用</text>
  </g>
  <text x="48" y="196" font-size="15" font-weight="700" fill="#111827">① 自底向上</text>
  <text x="48" y="213" font-size="10.5" fill="#64748b">Bottom-Up</text>
  <text x="48" y="235" font-size="11.5" fill="#374151">从物理层逐层往上查</text>
  <text x="48" y="253" font-size="11" fill="#6b7280">适用：怀疑链路/接口问题</text>

  <!-- 2 自顶向下 -->
  <g filter="url(#mc)"><rect x="335" y="75" width="290" height="200" rx="14" fill="#fff" stroke="#e5e7eb" stroke-width="1.3"/></g>
  <g>
    <line x1="480" y1="96" x2="480" y2="154" stroke="#0969da" stroke-width="2.2" marker-end="url(#ma)"/>
    <rect x="420" y="80" width="120" height="16" rx="4" fill="#93c5fd"/>
    <rect x="420" y="102" width="120" height="16" rx="4" fill="#bfdbfe"/>
    <rect x="420" y="124" width="120" height="16" rx="4" fill="#dbeafe"/>
    <text x="480" y="93" font-size="9.5" text-anchor="middle" fill="#1e3a8a">应用</text>
    <text x="480" y="115" font-size="9.5" text-anchor="middle" fill="#1e3a8a">路由/BGP</text>
    <text x="480" y="137" font-size="9.5" text-anchor="middle" fill="#1e3a8a">物理/链路</text>
  </g>
  <text x="353" y="196" font-size="15" font-weight="700" fill="#111827">② 自顶向下</text>
  <text x="353" y="213" font-size="10.5" fill="#64748b">Top-Down</text>
  <text x="353" y="235" font-size="11.5" fill="#374151">从应用/配置逐层往下查</text>
  <text x="353" y="253" font-size="11" fill="#6b7280">适用：怀疑配置/策略问题</text>

  <!-- 3 分而治之 -->
  <g filter="url(#mc)"><rect x="640" y="75" width="290" height="200" rx="14" fill="#fff" stroke="#e5e7eb" stroke-width="1.3"/></g>
  <g>
    <circle cx="785" cy="92" r="11" fill="#bfdbfe"/>
    <line x1="785" y1="103" x2="735" y2="130" stroke="#0969da" stroke-width="1.8"/>
    <line x1="785" y1="103" x2="835" y2="130" stroke="#0969da" stroke-width="1.8"/>
    <circle cx="735" cy="140" r="10" fill="#dbeafe"/>
    <circle cx="835" cy="140" r="10" fill="#dbeafe"/>
    <line x1="735" y1="150" x2="710" y2="166" stroke="#93c5fd" stroke-width="1.6"/>
    <line x1="735" y1="150" x2="760" y2="166" stroke="#93c5fd" stroke-width="1.6"/>
    <text x="785" y="177" font-size="10" text-anchor="middle" fill="#1e3a8a">二分定位故障边界</text>
  </g>
  <text x="658" y="196" font-size="15" font-weight="700" fill="#111827">③ 分而治之</text>
  <text x="658" y="213" font-size="10.5" fill="#64748b">Divide &amp; Conquer</text>
  <text x="658" y="235" font-size="11.5" fill="#374151">从中间点切入，二分缩小范围</text>
  <text x="658" y="253" font-size="11" fill="#6b7280">适用：长路径 / 大扇出</text>

  <!-- 4 沿路径追踪 -->
  <g filter="url(#mc)"><rect x="30" y="300" width="290" height="200" rx="14" fill="#fff" stroke="#e5e7eb" stroke-width="1.3"/></g>
  <g>
    <circle cx="80" cy="360" r="12" fill="#bfdbfe"/><text x="80" y="364" font-size="9" text-anchor="middle" fill="#1e3a8a">源</text>
    <circle cx="150" cy="360" r="12" fill="#bfdbfe"/>
    <circle cx="220" cy="360" r="12" fill="#bfdbfe"/>
    <circle cx="290" cy="360" r="12" fill="#93c5fd"/><text x="290" y="364" font-size="9" text-anchor="middle" fill="#1e3a8a">宿</text>
    <line x1="92" y1="360" x2="136" y2="360" stroke="#0969da" stroke-width="2" marker-end="url(#ma)"/>
    <line x1="162" y1="360" x2="206" y2="360" stroke="#0969da" stroke-width="2" marker-end="url(#ma)"/>
    <line x1="232" y1="360" x2="276" y2="360" stroke="#0969da" stroke-width="2" marker-end="url(#ma)"/>
    <text x="175" y="392" font-size="10" text-anchor="middle" fill="#1e3a8a">逐跳 ping/traceroute</text>
  </g>
  <text x="48" y="421" font-size="15" font-weight="700" fill="#111827">④ 沿路径追踪</text>
  <text x="48" y="438" font-size="10.5" fill="#64748b">Follow the Path</text>
  <text x="48" y="460" font-size="11.5" fill="#374151">顺数据路径逐跳验证到断点</text>
  <text x="48" y="478" font-size="11" fill="#6b7280">适用：转发不通 / 单向丢包</text>

  <!-- 5 配置比较 -->
  <g filter="url(#mc)"><rect x="335" y="300" width="290" height="200" rx="14" fill="#fff" stroke="#e5e7eb" stroke-width="1.3"/></g>
  <g>
    <rect x="372" y="320" width="100" height="66" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <rect x="492" y="320" width="100" height="66" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <line x1="384" y1="336" x2="458" y2="336" stroke="#94a3b8" stroke-width="1.6"/>
    <line x1="384" y1="350" x2="446" y2="350" stroke="#94a3b8" stroke-width="1.6"/>
    <line x1="384" y1="364" x2="458" y2="364" stroke="#94a3b8" stroke-width="1.6"/>
    <line x1="504" y1="336" x2="578" y2="336" stroke="#94a3b8" stroke-width="1.6"/>
    <rect x="504" y="345" width="74" height="12" rx="3" fill="#fecaca"/>
    <line x1="504" y1="364" x2="578" y2="364" stroke="#94a3b8" stroke-width="1.6"/>
    <text x="480" y="404" font-size="10" text-anchor="middle" fill="#b91c1c">红=差异行</text>
  </g>
  <text x="353" y="421" font-size="15" font-weight="700" fill="#111827">⑤ 配置比较</text>
  <text x="353" y="438" font-size="10.5" fill="#64748b">Compare Config</text>
  <text x="353" y="460" font-size="11.5" fill="#374151">好/坏设备配置 diff 找差异</text>
  <text x="353" y="478" font-size="11" fill="#6b7280">适用：一边正常一边故障</text>

  <!-- 6 组件替换 -->
  <g filter="url(#mc)"><rect x="640" y="300" width="290" height="200" rx="14" fill="#fff" stroke="#e5e7eb" stroke-width="1.3"/></g>
  <g>
    <rect x="682" y="330" width="66" height="46" rx="7" fill="#e2e8f0" stroke="#94a3b8"/>
    <line x1="748" y1="353" x2="800" y2="353" stroke="#0969da" stroke-width="2" marker-end="url(#ma)"/>
    <rect x="808" y="330" width="66" height="46" rx="7" fill="#dcfce7" stroke="#22c55e"/>
    <text x="715" y="357" font-size="9.5" text-anchor="middle" fill="#475569">坏件</text>
    <text x="841" y="357" font-size="9.5" text-anchor="middle" fill="#166534">换件</text>
    <text x="785" y="400" font-size="10" text-anchor="middle" fill="#1e3a8a">替换法隔离故障变量</text>
  </g>
  <text x="658" y="421" font-size="15" font-weight="700" fill="#111827">⑥ 组件替换</text>
  <text x="658" y="438" font-size="10.5" fill="#64748b">Component Swap</text>
  <text x="658" y="460" font-size="11.5" fill="#374151">换模块/线缆/设备做隔离</text>
  <text x="658" y="478" font-size="11" fill="#6b7280">适用：怀疑硬件 / 偶发故障</text>

  <rect x="30" y="510" width="900" height="2" fill="#e5e7eb"/>
  <text x="480" y="532" text-anchor="middle" font-size="11.5" fill="#0969da">基线是排错的一半功夫：保存正常态快照 + 管好每一次变更（2.4）</text>
</svg>